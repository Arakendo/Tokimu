name: Deploy website

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-website.yml"
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: website/requirements.txt

      - name: Install website dependencies
        run: python -m pip install -r website/requirements.txt

      - name: Install interactive-source dependencies
        run: npm ci --prefix website

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Typecheck and compile interactive source
        run: |
          npm run typecheck --prefix website
          npm run build --prefix website
          git diff --exit-code -- website/docs/javascripts/asset-observation.js

      - name: Test interactive island contract
        run: >-
          node --test
          website/tests/islands.test.mjs
          website/tests/asset-observation.test.mjs
          website/tests/static-fallback.test.mjs
          website/tests/svg-evidence.test.mjs
          website/tests/authoring-boundary.test.mjs

      - name: Build website
        run: python -m mkdocs build -f website/mkdocs.yml --strict

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/website

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
