name: Deploy website

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-website.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "corpus/consumers/tokimu-website-asteroids/**"
      - "corpus/consumers/tokimu-website-paint/**"
      - "corpus/consumers/tokimu-website-visualizer/**"
      - "corpus/consumers/tokimu-website-kernel-ui/**"
      - "corpus/consumers/tokimu-website-ratatui-lab/**"
      - "corpus/consumers/runtime-observation-workbench/**"
      - "corpus/consumers/aspnet-wasm-asset-workbench/**"
      - "corpus/lib/observation-shell/**"
      - "corpus/lib/ui-tools/**"
      - "corpus/consumers/ui-resource-workbench/**"
      - "corpus/lib/particle-tools/**"
      - "third-party/fonts/departure-mono"
      - "third-party/tosumu"
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Initialize website build fixtures
        run: |
          # Departure Mono supplies the native terminal/font corpus, while the
          # asset workbench's Rust/WASM engine links the accepted Tosumu
          # provider through its pinned submodule path.
          git submodule update --init --depth 1 third-party/fonts/departure-mono
          git submodule update --init --depth 1 third-party/tosumu

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: website/requirements.txt

      - name: Install website dependencies
        run: python -m pip install -r website/requirements.txt

      - name: Install interactive-source dependencies
        run: |
          npm ci --prefix website
          npm ci --prefix corpus/consumers/tokimu-website-asteroids
          npm ci --prefix corpus/consumers/tokimu-website-paint
          npm ci --prefix corpus/consumers/tokimu-website-visualizer
          npm ci --prefix corpus/consumers/tokimu-website-kernel-ui
          npm ci --prefix corpus/consumers/runtime-observation-workbench

      - name: Prepare Rust WebAssembly tools
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Typecheck and compile interactive source
        run: |
          # Build WASM-bindgen output first. The runtime-observation TypeScript
          # source imports its generated wrapper, which does not exist on a
          # clean GitHub runner until this step has run.
          pwsh -NoProfile -File website/scripts/build-interactive.ps1
          npm run typecheck --prefix website
          npm run typecheck --prefix corpus/consumers/tokimu-website-asteroids
          npm run typecheck --prefix corpus/consumers/tokimu-website-paint
          npm run typecheck --prefix corpus/consumers/tokimu-website-visualizer
          npm run typecheck --prefix corpus/consumers/tokimu-website-kernel-ui
          npm exec --prefix website -- tsc --noEmit --project corpus/consumers/tokimu-website-ratatui-lab/tsconfig.json
          npm exec --prefix website -- tsc --noEmit --project corpus/consumers/runtime-observation-workbench/tsconfig.json
          # WASM binaries and wasm-bindgen bindings are rebuilt for deployment,
          # but are not byte-stable across Windows and Linux build hosts.
          git diff --exit-code -- \
            website/docs/javascripts/asset-observation.js \
            website/docs/javascripts/asteroids-game.js \
            website/docs/assets/islands/asteroids-game/asteroids.js \
            website/docs/javascripts/tokimu-visualizer.js \
            website/docs/assets/islands/tokimu-visualizer/index.html \
            website/docs/assets/islands/tokimu-visualizer/visualizer.js \
            website/docs/assets/islands/tokimu-visualizer/styles.css \
            website/docs/javascripts/tokimu-paint.js \
            website/docs/assets/islands/tokimu-paint/index.html \
            website/docs/assets/islands/tokimu-paint/lucide.svg \
            website/docs/assets/islands/tokimu-paint/paint.js \
            website/docs/assets/islands/tokimu-paint/styles.css \
            website/docs/javascripts/kernel-ui.js \
            website/docs/assets/islands/kernel-ui/index.html \
            website/docs/assets/islands/kernel-ui/kernel-ui.js \
            website/docs/assets/islands/kernel-ui/styles.css \
            website/docs/javascripts/ratatui-lab.js \
            website/docs/assets/islands/ratatui-lab/index.html \
            website/docs/assets/islands/ratatui-lab/ratatui-lab.js \
            website/docs/assets/islands/ratatui-lab/styles.css

      - name: Test interactive island contract
        run: >-
          node --test
          website/tests/islands.test.mjs
          website/tests/asset-observation.test.mjs
          website/tests/asteroids-island.test.mjs
          website/tests/visualizer-island.test.mjs
          website/tests/paint-island.test.mjs
          website/tests/kernel-ui-island.test.mjs
          website/tests/ratatui-island.test.mjs
          website/tests/runtime-observation-island.test.mjs
          website/tests/static-fallback.test.mjs
          website/tests/svg-evidence.test.mjs
          website/tests/cgm-evidence.test.mjs
          website/tests/authoring-boundary.test.mjs
          website/tests/island-hardening.test.mjs

      - name: Build website
        run: python -m mkdocs build -f website/mkdocs.yml --strict

      - name: Validate generated website
        run: node --test website/tests/built-site.test.mjs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/website

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
