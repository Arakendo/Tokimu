expected = "structural-pass"

[[case]]
id = "paths-data-15-t.svg"
capability = ["path-data", "curve-continuity"]
reason = "Exercises curve transitions that should remain observable in flattened output."
expected = "structural-pass"

[[case]]
id = "paths-data-16-t.svg"
capability = ["path-data", "mixed-segments", "close-path"]
reason = "Provides path-data provenance, but the upstream fixture also carries unadmitted defs and text."
expected = "unsupported-profile"

[[case]]
id = "painting-fill-03-t.svg"
capability = ["fill-rule", "even-odd", "non-zero", "multiple-contours"]
reason = "Provides fill-rule provenance, but the upstream fixture also carries unadmitted defs and text."
expected = "unsupported-profile"

[[case]]
id = "struct-group-01-t.svg"
capability = ["nested-groups", "presentation-inheritance", "transform"]
reason = "Provides W3C provenance for group nesting, inherited fill, and nested rotation; its defs and text remain outside the initial SVG profile."
expected = "unsupported-profile"

[[case]]
id = "coords-trans-02-t.svg"
capability = ["transform", "nested-transform", "translation", "rotation"]
reason = "Provides W3C provenance for transform composition; its defs and text remain outside the initial SVG profile."
expected = "unsupported-profile"

[[derived_case]]
id = "paths-data-16-geometry.svg"
upstream = "paths-data-16-t.svg"
capability = ["path-data", "implicit-line", "relative-commands", "close-path"]
reason = "Retains the upstream path geometry while removing unrelated W3C metadata, defs, text, frame, and stroke styling."
expected = "structural-pass"

[[derived_case]]
id = "painting-fill-03-geometry.svg"
upstream = "painting-fill-03-t.svg"
capability = ["fill-rule", "even-odd", "non-zero", "self-intersection"]
reason = "Retains the upstream fill-rule geometry while removing unrelated W3C metadata, defs, text, frame, and stroke styling."
expected = "structural-pass-with-recorded-degenerates"

