[package]
name = "tokimu-render"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
experimental-scene-resource-reset = []
# Compatibility switch for historical corpus commands. ADR-0018 resource-set
# staging is now part of the ordinary tokimu-render surface.
experimental-scene-resource-staging = []
experimental-submission-local-geometry = []

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
pollster.workspace = true
raw-window-handle = "0.6"
thiserror.workspace = true
wgpu.workspace = true
tokimu-core = { path = "../tokimu-core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
    "HtmlCanvasElement",
    "Performance",
    "Window",
] }
