[package]
name = "hello-textured-box-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gltf-corpus = { path = "../../../lib/gltf-corpus" }
raster-image-corpus = { path = "../../../lib/raster-image-corpus" }
tokimu = { path = "../../../../crates/tokimu", features = ["platform", "render"] }
tokimu-core = { path = "../../../../crates/tokimu-core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = ["Document", "Element", "Event", "EventTarget", "HtmlCanvasElement", "KeyboardEvent", "Window"] }
