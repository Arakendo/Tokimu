<!doctype html><html lang="en"><meta charset="utf-8"><title>DOOM browser intake</title>
<body><main><h1>DOOM browser intake</h1><p>Local bytes only; no upload or WAD parsing in TypeScript.</p>
<button id="select">Select reviewed package</button><button id="inspect" disabled>Inspect DOOM1.WAD</button><button id="render-working" disabled>Render working model</button><button id="run-rotation" disabled>Run 3x map rotation</button><button id="map-previous" disabled aria-label="Previous map">[ E1M9</button><strong id="working-map">E1M1</strong><button id="map-next" disabled aria-label="Next map">E1M2 ]</button><button id="render" disabled>Render static E1M1</button><button id="render-cutouts" disabled>Render E1M1 masked cutouts</button><button id="render-selected" disabled>Render E1M1 selected cutouts</button><button id="render-diagnostic-sky" disabled>Render diagnostic sky omissions</button><button id="render-exitsign" disabled>Inspect EXITSIGN</button><button id="download" disabled>Download browser PNG</button><button id="clear" disabled>Clear intake</button><input id="package" type="file" accept=".zip,application/zip" hidden>
<p><strong>Working-model controls:</strong> click the canvas for mouse look; W/A/S/D move; Space/Ctrl fly; Shift runs; Escape releases the mouse.</p><pre id="result">Ready — select a local package.</pre><canvas id="scene" width="960" height="600" tabindex="0" style="cursor: crosshair" aria-label="Interactive DOOM browser working-model frame"></canvas></main><script type="module" src="./app/main.js"></script></body></html>
