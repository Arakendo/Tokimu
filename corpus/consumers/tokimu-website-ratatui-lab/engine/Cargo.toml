[package]
name = "tokimu-website-ratatui-lab-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Ratatui owns terminal-shaped composition while the corpus-local Tokimu
# backend owns retained cells and pixel production. Keep host terminal
# backends such as crossterm out of the browser-facing build.
ratatui = { version = "0.29.0", default-features = false }
serde = { workspace = true }
serde_json = "1"
ui-tools = { path = "../../../lib/ui-tools" }
tui-tools = { path = "../../../lib/tui-tools", features = ["ratatui-bridge"] }
wasm-bindgen = { workspace = true }
