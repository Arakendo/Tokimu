[package]
name = "tokimu-console-command-window"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Ratatui is corpus-only comparison evidence; native console targets do not
# depend on a terminal UI provider.
ratatui-evidence = ["dep:ratatui"]

[dependencies]
ratatui = { version = "0.29.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
screenshot = { path = "../../lib/screenshot" }
tokimu = { path = "../../../crates/tokimu", features = ["platform", "render"] }
tokimu-input = { path = "../../../crates/tokimu-input" }
ui-tools = { path = "../../lib/ui-tools" }

[[bin]]
name = "console-session-evidence"
path = "src/session_evidence.rs"

[[bin]]
name = "ratatui-session-evidence"
path = "src/ratatui_session_evidence.rs"
required-features = ["ratatui-evidence"]

[[bin]]
name = "tokimu-cell-layout-evidence"
path = "src/tokimu_cell_layout_evidence.rs"
required-features = ["ratatui-evidence"]

[[bin]]
name = "projection-conformance-evidence"
path = "src/projection_conformance_evidence.rs"
required-features = ["ratatui-evidence"]
