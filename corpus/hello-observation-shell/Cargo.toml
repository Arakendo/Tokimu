[package]
name = "hello-observation-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
ratatui-standalone = ["dep:crossterm", "dep:ratatui", "dep:unicode-width"]

[dependencies]
crossterm = { version = "0.28.1", optional = true }
hello-runtime-observation = { path = "../hello-runtime-observation" }
observation-shell = { path = "../lib/observation-shell" }
ratatui = { version = "0.29.0", default-features = false, features = ["crossterm"], optional = true }
tokimu-core = { path = "../../crates/tokimu-core" }
unicode-width = { version = "0.2.0", optional = true }

[[bin]]
name = "hello-observation-shell"
path = "src/main.rs"

[[bin]]
name = "hello-observation-shell-cli"
path = "src/cli.rs"

[[bin]]
name = "hello-observation-shell-ratatui"
path = "src/ratatui.rs"
required-features = ["ratatui-standalone"]
