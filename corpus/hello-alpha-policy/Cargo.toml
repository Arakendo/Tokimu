[package]
name = "hello-alpha-policy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "hello-alpha-policy"

[features]
native-visual = ["dep:tokimu"]

[dependencies]
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
tokimu = { path = "../../crates/tokimu", features = ["platform", "render"], optional = true }

[[bin]]
name = "native_scene"
path = "src/bin/native_scene.rs"
required-features = ["native-visual"]
