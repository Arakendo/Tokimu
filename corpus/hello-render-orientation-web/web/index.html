<!doctype html>
<html lang="en" data-orientation-state="loading">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tokimu Browser Orientation Conformance</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">AR-0021 · Browser/WASM evidence</p>
          <h1>Geometry orientation conformance</h1>
        </div>
        <p id="status" role="status">loading WASM</p>
      </header>
      <section class="labels columns" aria-hidden="true">
        <span>none</span><span>back</span><span>front</span>
      </section>
      <div class="matrix">
        <section class="labels rows" aria-hidden="true">
          <span>identity</span>
          <span>rotate + translate</span>
          <span>reflect X</span>
          <span>reflect + compensate</span>
        </section>
        <canvas id="orientation-canvas" width="1200" height="800"></canvas>
      </div>
      <footer>green = front_facing · magenta = back facing · supplied normal = +Z</footer>
    </main>
    <script type="module">
      const status = document.querySelector("#status");
      const reportUnhandledFailure = (detail) => {
        document.documentElement.dataset.orientationState = "failed";
        status.textContent = `failed | ${detail}`;
      };
      window.addEventListener("error", (event) => {
        reportUnhandledFailure(event.error?.stack ?? event.message ?? "unhandled browser error");
      });
      window.addEventListener("unhandledrejection", (event) => {
        const reason = event.reason;
        reportUnhandledFailure(reason?.stack ?? reason?.message ?? String(reason));
      });
      const settleWithin = (promise, milliseconds, label) => Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(
          () => reject(new Error(`${label} timed out after ${milliseconds / 1000} seconds`)),
          milliseconds,
        )),
      ]);
      if (!("gpu" in navigator)) {
        document.documentElement.dataset.orientationState = "unsupported";
        status.textContent = "unsupported | this browser does not expose WebGPU";
      } else {
        try {
          status.textContent = "checking browser WebGPU adapter";
          const adapter = await settleWithin(
            navigator.gpu.requestAdapter(),
            5000,
            "browser WebGPU adapter request",
          );
          if (!adapter) {
            throw new Error("browser WebGPU did not provide an adapter");
          }
          status.textContent = "browser adapter ready | checking browser WebGPU device";
          const device = await settleWithin(
            adapter.requestDevice(),
            5000,
            "browser WebGPU device request",
          );
          if (!device) {
            throw new Error("browser WebGPU did not provide a device");
          }
          status.textContent = "browser adapter and device ready | initializing Tokimu WASM";
          const { default: init, start_fixture: startFixture } = await import("./pkg/hello-render-orientation-web.js");
          await init();
          await new Promise((resolve) => requestAnimationFrame(resolve));
          startFixture();
          setTimeout(() => {
            if (document.documentElement.dataset.orientationState === "loading") {
              document.documentElement.dataset.orientationState = "unsupported";
              status.textContent = "unsupported | browser adapter and device preflight passed, but Tokimu WebGPU initialization timed out";
            }
          }, 10000);
        } catch (error) {
          document.documentElement.dataset.orientationState = "unsupported";
          status.textContent = `unsupported | ${error}`;
        }
      }
    </script>
  </body>
</html>
