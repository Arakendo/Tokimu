[package]
name = "hello-terminal-surface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
ratatui-producer = ["dep:ratatui"]

[dependencies]
ratatui = { version = "0.29.0", default-features = false, optional = true }
ui-tools = { path = "../../../lib/ui-tools" }
tui-tools = { path = "../../../lib/tui-tools" }
unicode-width = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokimu = { path = "../../../../crates/tokimu", features = ["platform", "render"] }
