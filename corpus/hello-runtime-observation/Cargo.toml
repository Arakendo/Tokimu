[package]
name = "hello-runtime-observation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
presentation-control = { path = "../lib/presentation-control" }
serde.workspace = true
serde_json = "1"
tokimu-core = { path = "../../crates/tokimu-core" }

# The source animation fixture uses meshopt compression on native builds.
# WASM observation consumers use the checked provider-neutral catalog fixture
# until a WASM-compatible meshopt provider is separately admitted.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gltf-corpus = { path = "../lib/gltf-corpus", features = ["meshopt"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gltf-corpus = { path = "../lib/gltf-corpus" }
