[workspace]
resolver = "2"
exclude = [
    # Tosumu remains an independently versioned workspace even when a corpus
    # bridge consumes its public crates by local submodule path.
    "third-party/tosumu",
    # Ring 0 source remains at its upstream workspace root while Tokimu
    # consumes the audited glam package through an explicit path dependency.
    "third-party/ring-0/glam",
]
members = [
    # Engine crates.
    "crates/tokimu",
    "crates/tokimu-core",
    "crates/tokimu-runtime",
    "crates/tokimu-render",
    "crates/tokimu-platform",
    "crates/tokimu-assets",
    "crates/tokimu-input",
    "crates/tokimu-rule",
    "crates/tokimu-ts-frontend",
    "crates/tokimu-wasm",

    # Platform and presentation corpus.
    "corpus/focused/foundations/hello-window",
    "corpus/focused/foundations/hello-triangle",
    "corpus/focused/foundations/hello-3d-mono",
    "corpus/focused/foundations/hello-3d-stereo",
    "corpus/focused/foundations/hello-3d-openxr",
    "corpus/focused/foundations/hello-shader",
    "corpus/focused/audio/hello-audio-visualizer",
    "corpus/focused/audio/hello-audio-analysis",
    "corpus/focused/audio/hello-milkdrop",
    "corpus/focused/foundations/hello-vector-draw",
    "corpus/campaigns/coordinate-conformance/hello-render-orientation",
    "corpus/campaigns/coordinate-conformance/hello-render-orientation-web",
    "corpus/campaigns/native-math/hello-bulk-compute-web",
    "corpus/campaigns/textured-presentation/hello-textured-box-web",
    "corpus/campaigns/textured-presentation/hello-alpha-policy",
    "corpus/campaigns/textured-presentation/hello-alpha-policy-web",

    # Simulation and application corpus.
    "corpus/focused/simulation/hello-rule-model",
    "corpus/focused/simulation/hello-2d-physics",
    "corpus/focused/simulation/hello-snake",
    "corpus/focused/simulation/hello-pacman",
    "corpus/focused/simulation/hello-space-invaders",
    "corpus/focused/simulation/hello-missile-command",
    "corpus/focused/simulation/hello-asteroids",
    "corpus/focused/simulation/hello-particles",
    "corpus/focused/simulation/hello-fps-web",
    "corpus/focused/simulation/hello-cad",
    "corpus/focused/observation/hello-runtime-observation",
    "corpus/focused/observation/hello-runtime-inspector",
    "corpus/focused/observation/hello-observation-shell",
    "corpus/focused/observation/hello-terminal-surface",
    "corpus/focused/observation/hello-observation-mud",
    "corpus/focused/observation/hello-observation-workbench",
    "corpus/focused/observation/hello-tui-tools",

    # Data, interchange, and output corpus.
    "corpus/focused/data-interchange/hello-svg",
    "corpus/focused/data-interchange/hello-cgm",
    "corpus/focused/data-interchange/hello-glb",
    "corpus/campaigns/textured-presentation/hello-textured-box",
    "corpus/campaigns/textured-presentation/hello-hole-punch",
    "corpus/focused/data-interchange/hello-xml-inspect",
    "corpus/focused/data-interchange/hello-file-io",
    "corpus/focused/data-interchange/hello-resource-space",
    "corpus/focused/data-interchange/hello-save-image",
    "corpus/focused/data-interchange/hello-raster-image",
    "corpus/focused/data-interchange/hello-compression",
    "corpus/focused/data-interchange/hello-archive",
    "corpus/campaigns/doom/hello-wad-inspect",
    "corpus/campaigns/doom/hello-doom-e1m1",
    "corpus/campaigns/doom/hello-doom-visibility-conformance",
    "corpus/campaigns/doom/hello-doom-visibility-conformance-web",
    "corpus/campaigns/doom/hello-doom-spatial-query-portable",
    "corpus/campaigns/textured-presentation/hello-streaming-texture",
    "corpus/campaigns/textured-presentation/hello-texture-color-space",
    "corpus/campaigns/renderer-reliability/hello-render-resource-identity",
    "corpus/campaigns/renderer-reliability/hello-render-resource-identity-web",
    "corpus/campaigns/renderer-reliability/hello-browser-terminal-observer",

    # Networking corpus.
    "corpus/focused/networking/hello-network-loopback",
    "corpus/focused/networking/hello-network-client-server",

    # Downstream application-shaped consumer corpus.
    "corpus/consumers/aspnet-wasm-asset-workbench/engine",
    "corpus/consumers/doom-ts-boundary-workbench/engine",
    "corpus/consumers/aspnet-wasm-presentation-workbench/engine",
    "corpus/consumers/tokimu-website-asteroids/engine",
    "corpus/consumers/tokimu-website-visualizer/engine",
    "corpus/consumers/tokimu-website-paint/engine",
    "corpus/consumers/runtime-observation-workbench/engine",
    "corpus/consumers/ui-settings-workbench",
    "corpus/consumers/ui-resource-workbench",
    "corpus/consumers/tokimu-website-kernel-ui/engine",
    "corpus/consumers/tokimu-website-ratatui-lab/engine",
    "corpus/consumers/dotnet-tosumu-resource-workbench/engine",
    "corpus/consumers/tosumu-tql-cli-consumer",
    "corpus/consumers/tokimu-console-command-window",

    # UI corpus.
    "corpus/ui/hello-ui",
    "corpus/ui/hello-ui-button",
    "corpus/ui/hello-ui-box",
    "corpus/ui/hello-ui-card",
    "corpus/ui/hello-ui-toolbar",
    "corpus/ui/hello-ui-panel",
    "corpus/ui/hello-ui-theme",
    "corpus/ui/hello-ui-text",
    "corpus/ui/hello-ui-layout",
    "corpus/ui/hello-ui-state",
    "corpus/ui/hello-ui-input",
    "corpus/ui/hello-ui-textinput",
    "corpus/ui/hello-ui-inspector",
    "corpus/ui/hello-ui-scroll",
    "corpus/ui/hello-ui-animation",
    "corpus/ui/hello-ui-dialog",
    "corpus/ui/hello-ui-icons",
    "corpus/ui/hello-ui-glyph-corpus",
    "corpus/ui/hello-ui-font",
    "corpus/ui/hello-ui-font2",
    "corpus/ui/hello-ui-text-vectors",
    "corpus/ui/hello-ui-lucide",
    "corpus/ui/hello-ui-lucide2",
    "corpus/ui/hello-ui-dashboard",

    # Incubating shared corpus libraries.
    "corpus/lib/audio-tools",
    "corpus/lib/cpal-audio-output-provider",
    "corpus/lib/simple-audio-synth-provider",
    "corpus/lib/screenshot",
    "corpus/lib/resource-space",
    "corpus/lib/resource-space-assets",
    "corpus/lib/resource-space-xml",
    "corpus/lib/resource-space-json",
    "corpus/lib/resource-space-native",
    "corpus/lib/resource-space-compression",
    "corpus/lib/resource-space-archive",
    "corpus/lib/network-tools",
    "corpus/lib/cgm-corpus",
    "corpus/lib/compression-provider",
    "corpus/lib/archive-provider",
    "corpus/lib/archive-file-adapter",
    "corpus/lib/doom-wad-provider",
    "corpus/lib/doom-wad-package",
    "corpus/lib/doom-map-provider",
    "corpus/lib/doom-geometry-provider",
    "corpus/lib/doom-audio-provider",
    "corpus/lib/doom-raster-provider",
    "corpus/lib/diff-tools",
    "corpus/lib/fbx-corpus",
    "corpus/lib/gltf-corpus",
    "corpus/lib/presentation-control",
    "corpus/lib/presentation-geometry-corpus",
    "corpus/lib/render-orientation-conformance",
    "corpus/lib/performance-diagnostics-corpus",
    "corpus/lib/particle-tools",
    "corpus/lib/raster-image-corpus",
    "corpus/lib/xml-tools",
    "corpus/lib/ui-tools",
    "corpus/lib/ui-validation-corpus",
    "corpus/lib/ui-framework",
    "corpus/lib/visualizer-tools",
    "corpus/lib/milkdrop-tools",
    "corpus/lib/observation-shell",
    "corpus/lib/tui-tools",
    "corpus/lib/tokimu-math-study",
    "corpus/lib/tokimu-spatial-query-study",
    "corpus/lib/tokimu-math-study/corpus-cases/hello-3d-mono/alternative-b",
    "corpus/lib/tokimu-math-study/corpus-cases/hello-3d-mono/alternative-c",

    # Cross-workspace integration tests.
    "tests",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/Arakendo/Tokimu"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
cpal = "0.18.1"
ron = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-wasm = "0.2"
console_error_panic_hook = "0.1"
glam = { path = "third-party/ring-0/glam", version = "0.33.3", default-features = false, features = ["std"] }
wgpu = "23"
winit = "0.30"
pollster = "0.4"
wasm-bindgen = "0.2"
web-sys = "0.3"
js-sys = "0.3"
